version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: raphael
      POSTGRES_USER: raphael
      POSTGRES_PASSWORD: raphael
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raphael -d raphael"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-laravel:
    image: php:8.3-cli
    working_dir: /app
    environment:
      PULSE_ENGINE_URL: http://pulse-engine:8001
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend-laravel:/app
    ports:
      - "8000:8000"
    command: ["sh", "-c", "apt-get update && apt-get install -y --no-install-recommends libpq-dev && docker-php-ext-install pdo_pgsql && php -S 0.0.0.0:8000 -t public"]

  pulse-engine:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./pulse-engine:/app
    ports:
      - "8001:8001"
    command: ["sh", "-c", "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8001"]

  admin-dashboard:
    image: node:20-slim
    working_dir: /app
    environment:
      NEXT_PUBLIC_PULSE_URL: http://localhost:8001
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8000
    volumes:
      - ./frontend/web-dashboard:/app
    ports:
      - "3001:3001"
    command: ["sh", "-c", "npm install && npm run dev"]

volumes:
  pgdata:
